[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copyspan"
version = "0.1.0"
description = "Measure how much of an output text is copied from its source: extractive fragments, coverage, density, novel n-grams."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
keywords = ["summarization", "extractiveness", "copying", "n-gram", "datasets", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4"]

[project.scripts]
copyspan = "copyspan.cli:main"

[project.urls]
Homepage = "https://github.com/vipul21435/copyspan"

[tool.hatch.build.targets.wheel]
packages = ["src/copyspan"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
